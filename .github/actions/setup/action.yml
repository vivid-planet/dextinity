name: Setup
description: Set up pnpm, Node.js, install dependencies, and optionally run setup:ci and build:packages.

inputs:
    setup-ci:
        description: Whether to run `pnpm run setup:ci`.
        default: "true"
    build-packages:
        description: Whether to run `pnpm run build:packages`.
        default: "false"
    project:
        description: Name of a workspace project to set up instead of the whole workspace. Only the project and its dependencies are installed, and `build-packages` builds only the `@dextinity/*` packages among them.
        default: ""

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v6

        - name: Use Node.js 24.x
          uses: actions/setup-node@v7
          with:
              node-version: 24
              registry-url: "https://registry.npmjs.org"
              cache: "pnpm" # https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-dependencies

        - shell: bash
          run: pnpm install --frozen-lockfile ${PROJECT:+--filter "$PROJECT..."}
          env:
              PROJECT: ${{ inputs.project }}

        - name: Setup project for CI run
          if: ${{ inputs.setup-ci == 'true' }}
          shell: bash
          run: pnpm run setup:ci

        - name: Build packages
          if: ${{ inputs.build-packages == 'true' }}
          shell: bash
          run: |
              if [[ -z "$PROJECT" ]]; then
                  pnpm run build:packages
              elif [[ "$PROJECT" == @dextinity/* ]]; then
                  pnpm --filter "$PROJECT..." run build
              else
                  pnpm --filter "$PROJECT^..." run build
              fi
          env:
              PROJECT: ${{ inputs.project }}
