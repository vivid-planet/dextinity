name: Update DigitalOcean Demo Deployment

on:
    push:
        branches:
            - main
    # Only until the deployment has been tested, then the demo only deploys from main
    pull_request:
        branches:
            - main
    workflow_dispatch:

# There's only one deployment, so a newer run replaces a running one
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    update-deployment:
        name: Update DigitalOcean Demo Deployment
        # Only the pull request that sets up the deployment, which can't come from a fork, because those get no secrets
        if: github.repository == 'vivid-planet/dextinity' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/deploy-demo-digitalocean'))
        runs-on: ubuntu-latest
        env:
            # The branch App Platform builds from
            DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        steps:
            - name: Check that all variables and secrets are set
              env:
                  DIGITALOCEAN_API_KEY: ${{ secrets.DIGITALOCEAN_API_KEY }}
                  DEMO_DIGITALOCEAN_PROJECT_ID: ${{ vars.DEMO_DIGITALOCEAN_PROJECT_ID }}
                  DEMO_IDP_CLIENT_ID: ${{ vars.DEMO_IDP_CLIENT_ID }}
                  DEMO_OAUTH2_PROXY_CLIENT_SECRET: ${{ secrets.DEMO_OAUTH2_PROXY_CLIENT_SECRET }}
                  DEMO_OAUTH2_PROXY_COOKIE_SECRET: ${{ secrets.DEMO_OAUTH2_PROXY_COOKIE_SECRET }}
                  DEMO_POSTGRESQL_PWD_BASE64: ${{ secrets.DEMO_POSTGRESQL_PWD_BASE64 }}
                  DEMO_S3_ACCESS_KEY_ID: ${{ secrets.DEMO_S3_ACCESS_KEY_ID }}
                  DEMO_S3_SECRET_ACCESS_KEY: ${{ secrets.DEMO_S3_SECRET_ACCESS_KEY }}
                  DEMO_IMGPROXY_KEY: ${{ secrets.DEMO_IMGPROXY_KEY }}
                  DEMO_IMGPROXY_SALT: ${{ secrets.DEMO_IMGPROXY_SALT }}
                  DEMO_API_BASIC_AUTH_SYSTEM_USER_PASSWORD: ${{ secrets.DEMO_API_BASIC_AUTH_SYSTEM_USER_PASSWORD }}
                  DEMO_DAM_SECRET: ${{ secrets.DEMO_DAM_SECRET }}
                  DEMO_FILE_UPLOADS_DOWNLOAD_SECRET: ${{ secrets.DEMO_FILE_UPLOADS_DOWNLOAD_SECRET }}
                  DEMO_SITE_PREVIEW_SECRET: ${{ secrets.DEMO_SITE_PREVIEW_SECRET }}
              run: |
                  missing=0
                  for name in DIGITALOCEAN_API_KEY DEMO_DIGITALOCEAN_PROJECT_ID DEMO_IDP_CLIENT_ID DEMO_OAUTH2_PROXY_CLIENT_SECRET DEMO_OAUTH2_PROXY_COOKIE_SECRET DEMO_POSTGRESQL_PWD_BASE64 DEMO_S3_ACCESS_KEY_ID DEMO_S3_SECRET_ACCESS_KEY DEMO_IMGPROXY_KEY DEMO_IMGPROXY_SALT DEMO_API_BASIC_AUTH_SYSTEM_USER_PASSWORD DEMO_DAM_SECRET DEMO_FILE_UPLOADS_DOWNLOAD_SECRET DEMO_SITE_PREVIEW_SECRET; do
                      if [ -z "${!name}" ]; then
                          echo "::error::$name isn't set, see demo/.digitalocean/README.md"
                          missing=1
                      fi
                  done
                  exit $missing

            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - name: Inject site configs
              run: |
                  for app in cms site; do
                      pnpm exec dextinity inject-site-configs -f demo/site-configs/site-configs.ts -i demo/.digitalocean/dextinity-demo-$app.tpl.yaml -o demo/.digitalocean/dextinity-demo-$app.yaml --base64
                  done

            - name: Update DigitalOcean dextinity-demo-imgproxy Deployment
              uses: digitalocean/app_action/deploy@v2
              env:
                  IMGPROXY_KEY: ${{ secrets.DEMO_IMGPROXY_KEY }}
                  IMGPROXY_SALT: ${{ secrets.DEMO_IMGPROXY_SALT }}
                  S3_ACCESS_KEY_ID: ${{ secrets.DEMO_S3_ACCESS_KEY_ID }}
                  S3_SECRET_ACCESS_KEY: ${{ secrets.DEMO_S3_SECRET_ACCESS_KEY }}
              with:
                  token: ${{ secrets.DIGITALOCEAN_API_KEY }}
                  project_id: ${{ vars.DEMO_DIGITALOCEAN_PROJECT_ID }}
                  print_deploy_logs: true
                  print_build_logs: true
                  app_spec_location: demo/.digitalocean/dextinity-demo-imgproxy.yaml

            - name: Update DigitalOcean dextinity-demo-cms Deployment
              uses: digitalocean/app_action/deploy@v2
              env:
                  IDP_CLIENT_ID: ${{ vars.DEMO_IDP_CLIENT_ID }}
                  POSTGRESQL_PWD_BASE64: ${{ secrets.DEMO_POSTGRESQL_PWD_BASE64 }}
                  S3_ACCESS_KEY_ID: ${{ secrets.DEMO_S3_ACCESS_KEY_ID }}
                  S3_SECRET_ACCESS_KEY: ${{ secrets.DEMO_S3_SECRET_ACCESS_KEY }}
                  IMGPROXY_KEY: ${{ secrets.DEMO_IMGPROXY_KEY }}
                  IMGPROXY_SALT: ${{ secrets.DEMO_IMGPROXY_SALT }}
                  OAUTH2_PROXY_CLIENT_SECRET: ${{ secrets.DEMO_OAUTH2_PROXY_CLIENT_SECRET }}
                  OAUTH2_PROXY_COOKIE_SECRET: ${{ secrets.DEMO_OAUTH2_PROXY_COOKIE_SECRET }}
                  API_BASIC_AUTH_SYSTEM_USER_PASSWORD: ${{ secrets.DEMO_API_BASIC_AUTH_SYSTEM_USER_PASSWORD }}
                  DAM_SECRET: ${{ secrets.DEMO_DAM_SECRET }}
                  FILE_UPLOADS_DOWNLOAD_SECRET: ${{ secrets.DEMO_FILE_UPLOADS_DOWNLOAD_SECRET }}
                  SITE_PREVIEW_SECRET: ${{ secrets.DEMO_SITE_PREVIEW_SECRET }}
              with:
                  token: ${{ secrets.DIGITALOCEAN_API_KEY }}
                  project_id: ${{ vars.DEMO_DIGITALOCEAN_PROJECT_ID }}
                  print_deploy_logs: true
                  print_build_logs: true
                  app_spec_location: demo/.digitalocean/dextinity-demo-cms.yaml

            - name: Update DigitalOcean dextinity-demo-site Deployment
              uses: digitalocean/app_action/deploy@v2
              env:
                  API_BASIC_AUTH_SYSTEM_USER_PASSWORD: ${{ secrets.DEMO_API_BASIC_AUTH_SYSTEM_USER_PASSWORD }}
              with:
                  token: ${{ secrets.DIGITALOCEAN_API_KEY }}
                  project_id: ${{ vars.DEMO_DIGITALOCEAN_PROJECT_ID }}
                  print_deploy_logs: true
                  print_build_logs: true
                  app_spec_location: demo/.digitalocean/dextinity-demo-site.yaml
