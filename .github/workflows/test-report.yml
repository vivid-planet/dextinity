name: "Test Report"
on:
    workflow_run:
        workflows: ["Test"]
        types:
            - completed

# The triggering run's branch name alone is ambiguous: a fork's branch can carry the same
# name as one of ours. Qualify it with the head repository so a fork's "main" doesn't
# cancel the report for ours.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: true

jobs:
    test-report-unit:
        name: "Test Report (unit)"
        runs-on: ubuntu-latest
        steps:
            - uses: dorny/test-reporter@v3
              with:
                  artifact: test-results-unit
                  name: Tests
                  path: "**/junit-*.xml"
                  reporter: jest-junit
    test-report-storybook:
        name: "Test Report (storybook)"
        runs-on: ubuntu-latest
        steps:
            - uses: dorny/test-reporter@v3
              with:
                  artifact: test-results-storybook
                  name: Tests
                  path: "**/junit-*.xml"
                  reporter: jest-junit
