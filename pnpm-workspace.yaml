packages:
    - "packages/**"
    - "demo/**"
    - "docs"
    - "storybook"

autoInstallPeers: false
dedupePeerDependents: true
strictPeerDependencies: true

peerDependencyRules:
    allowedVersions:
        # mjml-core 5 depends on cssnano 7 but pins htmlnano 3.3.1, whose optional cssnano peer asks for 8.
        htmlnano>cssnano: "7"
        react-final-form>react: "19"
        react-final-form-arrays>react: "19"
        tsconfck>typescript: "6"

overrides:
    "@apollo/server-plugin-landing-page-graphql-playground>@apollo/server": "^5.1.0"
    # nest-commander pins 7.0.3, which predates NestJS 12 support.
    "nest-commander>@golevelup/nestjs-discovery": "^7.1.0"

# None of these dependencies needs its build scripts to run in this repository.
allowBuilds:
    "@apollo/protobufjs": false
    "@mui/x-telemetry": false
    "@nestjs/core": false
    "@parcel/watcher": false
    "@swc/core": false
    core-js: false
    esbuild: false
    msw: false
    protobufjs: false
    sharp: false
