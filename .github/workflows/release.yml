name: Release (v9)

on:
    push:
        branches:
            - v9.x.x

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        concurrency:
            group: release-v9
            cancel-in-progress: true
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6

            - uses: ./.github/actions/setup

            - name: Get version to be published
              run: |
                  cd packages/admin/admin
                  echo "PUBLISHED_VERSION=$(pnpm pkg get version | sed -r 's/"//g')" >> $GITHUB_ENV

            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@v1.9.0
              with:
                  version: pnpm run version
                  publish: pnpm run publish --tag=stable-v9
                  title: "Version Packages (v9)"
                  # We create one release for all packages instead of a release per package
                  createGithubReleases: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  HUSKY: 0 # https://typicode.github.io/husky/#/?id=with-env-variables

            - name: Create GitHub release
              if: ${{ steps.changesets.outputs.published == 'true' }}
              run: node .github/scripts/create-github-release.mjs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
