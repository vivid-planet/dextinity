name: Test

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
    push:
        branches:
            - main
            - next

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-unit:
        name: Test (unit)
        runs-on: ubuntu-latest
        steps:
            - run: echo "${{ github.actor }}"

            - uses: actions/checkout@v7
            - run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com

            - uses: ./.github/actions/setup
              with:
                  build-packages: "true"

            - name: Test (unit)
              run: pnpm run test:unit

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: success() || failure()
              with:
                  name: test-results-unit
                  path: |
                      packages/*/junit-unit.xml
                      packages/*/*/junit-unit.xml
                      demo/*/junit-unit.xml
                  overwrite: true

    detect-storybook-packages:
        name: Detect packages with Storybook tests
        runs-on: ubuntu-latest
        outputs:
            packages: ${{ steps.detect.outputs.packages }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - name: Detect packages
              id: detect
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      base="$(git merge-base "origin/$BASE_REF" HEAD)"
                      # Changes outside of the workspace packages can affect every package
                      if git diff --name-only "$base" HEAD | grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/test\.yml|\.github/actions/)'; then
                          filter="*"
                      else
                          filter="...[$base]"
                      fi
                  else
                      filter="*"
                  fi

                  packages="$(pnpm --filter "$filter" ls --depth -1 --json | node -e '
                      const fs = require("node:fs");
                      const projects = JSON.parse(fs.readFileSync(0, "utf8"));
                      const names = projects
                          .filter(({ path }) => path !== process.cwd())
                          .filter(({ path }) => JSON.parse(fs.readFileSync(`${path}/package.json`, "utf8")).scripts?.["test:storybook"])
                          .map(({ name }) => name);
                      console.log(JSON.stringify(names));
                  ')"
                  echo "Packages with Storybook tests to run: $packages"
                  echo "packages=$packages" >> "$GITHUB_OUTPUT"

    test-storybook:
        name: Test (storybook, ${{ matrix.package }})
        needs: detect-storybook-packages
        if: needs.detect-storybook-packages.outputs.packages != '[]'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJSON(needs.detect-storybook-packages.outputs.packages) }}
        steps:
            - run: echo "${{ github.actor }}"

            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref || github.ref }}
                  token: ${{ secrets.GITHUB_TOKEN }}
            - run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com

            - uses: ./.github/actions/setup
              with:
                  build-packages: "true"

            - name: Install Playwright Browsers
              run: pnpm --filter dextinity-storybook exec playwright install chromium-headless-shell

            - name: Test (storybook)
              run: pnpm --filter "${{ matrix.package }}" run test:storybook

            - name: Get artifact name
              id: artifact-name
              if: success() || failure()
              env:
                  PACKAGE: ${{ matrix.package }}
              run: echo "name=test-results-storybook-$(echo "$PACKAGE" | sed 's/[@\/]/-/g; s/^-//')" >> "$GITHUB_OUTPUT"

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: success() || failure()
              with:
                  name: ${{ steps.artifact-name.outputs.name }}
                  path: |
                      packages/*/junit-storybook.xml
                      packages/*/*/junit-storybook.xml
                      storybook/junit.xml
                  overwrite: true
