name: Release (v8)

on:
    push:
        branches:
            - v8.x.x

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        concurrency:
            group: release-v8
            cancel-in-progress: true
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - name: Use Node.js 24.x
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
                  cache: "pnpm" # https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-dependencies

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Setup project for CI run
              run: pnpm run setup:ci

            - name: Get version to be published
              run: |
                  cd packages/admin/admin
                  echo "PUBLISHED_VERSION=$(pnpm pkg get version | sed -r 's/"//g')" >> $GITHUB_ENV

            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@v1.9.0
              with:
                  version: pnpm run version
                  publish: pnpm run publish --tag=stable-v8
                  title: "Version Packages (v8)"
                  # We create one release for all packages instead of a release per package
                  createGithubReleases: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  HUSKY: 0 # https://typicode.github.io/husky/#/?id=with-env-variables

            - name: Create GitHub release
              if: ${{ steps.changesets.outputs.published == 'true' }}
              run: node .github/scripts/create-github-release.mjs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
