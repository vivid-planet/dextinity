name: Build Docs

on:
    pull_request:
        paths:
            - docs/**
    push:
        paths:
            - docs/**
        branches:
            - main
            - next

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - run: echo "${{ github.actor }}"

            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - name: Build docs
              run: pnpm build:docs
