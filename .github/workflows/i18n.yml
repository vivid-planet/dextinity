name: i18n

on:
    push:
        branches:
            - main

jobs:
    i18n:
        runs-on: ubuntu-latest
        steps:
            - run: echo "${{ github.actor }}"

            - uses: actions/checkout@v6
            - run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com

            - name: "Library: Clone translations"
              uses: actions/checkout@v6
              with:
                  repository: vivid-planet/dextinity-lang
                  token: ${{ secrets.VIVID_PLANET_BOT_TOKEN }}
                  path: "demo/admin/lang/dextinity-lang"

            - uses: ./.github/actions/setup

            - name: "Library: Extract i18n strings"
              run: |
                  pnpm run intl:extract
                  cp -r lang/* demo/admin/lang/dextinity-lang/

            - name: "Library: Update translatable strings"
              uses: EndBug/add-and-commit@v10
              with:
                  cwd: "./demo/admin/lang/dextinity-lang"

            - name: "Demo Admin: Clone translations"
              uses: actions/checkout@v6
              with:
                  repository: vivid-planet/dextinity-demo-lang
                  token: ${{ secrets.VIVID_PLANET_BOT_TOKEN }}
                  path: "demo/admin/lang/dextinity-demo-lang"

            - name: "Demo Admin: Extract i18n strings"
              run: |
                  cd demo/admin
                  pnpm run intl:extract
                  cp -r lang-extracted/* lang/dextinity-demo-lang/admin

            - name: "Demo Admin: Update translatable strings"
              uses: EndBug/add-and-commit@v10
              with:
                  cwd: "./demo/admin/lang/dextinity-demo-lang"

            - name: "Demo Site: Clone translations"
              uses: actions/checkout@v6
              with:
                  repository: vivid-planet/dextinity-demo-lang
                  token: ${{ secrets.VIVID_PLANET_BOT_TOKEN }}
                  path: "demo/site/lang/dextinity-demo-lang"

            - name: "Demo Site: Extract i18n strings"
              run: |
                  cd demo/site
                  pnpm run intl:extract
                  cp -r lang-extracted/* lang/dextinity-demo-lang/site

            - name: "Demo Site: Update translatable strings"
              uses: EndBug/add-and-commit@v10
              with:
                  cwd: "./demo/site/lang/dextinity-demo-lang"

            - name: "Demo Api: Clone translations"
              uses: actions/checkout@v6
              with:
                  repository: vivid-planet/dextinity-demo-lang
                  token: ${{ secrets.VIVID_PLANET_BOT_TOKEN }}
                  path: "demo/api/lang/dextinity-demo-lang"

            - name: "Demo Api: Extract i18n strings"
              run: |
                  cd demo/api
                  pnpm run intl:extract
                  cp -r lang-extracted/* lang/dextinity-demo-lang/api

            - name: "Demo Api: Update translatable strings"
              uses: EndBug/add-and-commit@v10
              with:
                  cwd: "./demo/api/lang/dextinity-demo-lang"
