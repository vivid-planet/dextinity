name: Release

on:
    push:
        branches:
            - main

# Releases publish to npm, so an in-flight run must never be aborted:
# queue the next run instead of cancelling the running one.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - name: Get version to be published
              run: |
                  cd packages/admin/admin
                  echo "PUBLISHED_VERSION=$(pnpm pkg get version | sed -r 's/"//g')" >> $GITHUB_ENV

            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@v2.1.2
              with:
                  version: pnpm run version
                  publish: pnpm run publish
                  # We create one release for all packages instead of a release per package
                  createGithubReleases: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  HUSKY: 0 # https://typicode.github.io/husky/#/?id=with-env-variables

            - name: Create GitHub release
              if: ${{ steps.changesets.outputs.published == 'true' }}
              run: node .github/scripts/create-github-release.mjs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
