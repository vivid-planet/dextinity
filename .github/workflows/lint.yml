name: Lint

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
    push:
        branches:
            - main
            - next

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - run: echo "${{ github.actor }}"

            - uses: actions/checkout@v7
            - run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com

            - uses: ./.github/actions/setup
              with:
                  build-packages: "true"

            - name: Lint
              run: |
                  pnpm run lint:ci
                  # check for duplicate ids of formatted messages
                  pnpm run intl:extract
                  # check if schema files are up to date
                  pnpm --filter '@dextinity/cms-api' run generate-block-meta
                  pnpm --filter '@dextinity/cms-api' run generate-schema
                  pnpm --filter '@dextinity/brevo-api' run generate-schema
                  git diff --exit-code HEAD --
